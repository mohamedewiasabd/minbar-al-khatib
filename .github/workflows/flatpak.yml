name: Flatpak (Flathub)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ca-certificates
          flatpak-builder --version

      - name: Add Flathub remote + GNOME runtime
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive org.gnome.Platform//47
          sudo flatpak install -y --noninteractive org.gnome.Sdk//47

      - name: Build flatpak
        run: |
          mkdir -p build-dir
          flatpak-builder --force-clean --state-dir=fdk-build-state --repo=fdk-build-repo build-dir flatpak/com.minbar.khatib.yml

      - name: Bundle .flatpak
        run: |
          mkdir -p dist-flatpak
          flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo fdk-build-repo dist-flatpak/com.minbar.khatib.flatpak com.minbar.khatib

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: minbar-flatpak
          path: dist-flatpak/com.minbar.khatib.flatpak
          if-no-files-found: error