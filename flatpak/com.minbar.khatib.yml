app-id: com.minbar.khatib
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: minbar-khatib
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
cleanup:
  - /include
  - /share/man
  - '*.a'
  - '*.la'
modules:
  - name: minbar-khatib
    buildsystem: simple
    only-arches:
      - x86_64
    build-commands:
      - |
        set -e
        mkdir -p deb-extract
        ar -x *.deb --output deb-extract
        tar -C deb-extract -xf deb-extract/data.tar.gz
      - install -Dm755 deb-extract/usr/bin/minbar-khatib /app/bin/minbar-khatib
      - install -Dm644 deb-extract/usr/share/applications/minbar-khatib.desktop /app/share/applications/com.minbar.khatib.desktop
      - sed -i 's/^Icon=.*/Icon=com.minbar.khatib/' /app/share/applications/com.minbar.khatib.desktop
      - install -Dm644 deb-extract/usr/share/icons/hicolor/32x32/apps/minbar-khatib.png /app/share/icons/hicolor/32x32/apps/com.minbar.khatib.png
      - install -Dm644 deb-extract/usr/share/icons/hicolor/128x128/apps/minbar-khatib.png /app/share/icons/hicolor/128x128/apps/com.minbar.khatib.png
      - install -Dm644 deb-extract/usr/share/icons/hicolor/256x256@2/apps/minbar-khatib.png /app/share/icons/hicolor/512x512/apps/com.minbar.khatib.png
      - install -Dm644 com.minbar.khatib.metainfo.xml /app/share/metainfo/com.minbar.khatib.metainfo.xml
    sources:
      - type: file
        url: https://github.com/mohamedewiasabd/minbar-al-khatib/releases/download/v1.13/minbar-khatib_1.13.0_amd64.deb
        sha256: f0f1edc16a5f33e9d31ac0ca11b004242cb41ea38f2fe3fe395e0c597d003116
        only-arches:
          - x86_64
      - type: file
        path: com.minbar.khatib.metainfo.xml