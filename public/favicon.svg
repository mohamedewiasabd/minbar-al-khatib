<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="85%">
      <stop offset="0%" stop-color="#11503a"/>
      <stop offset="55%" stop-color="#0a3a2a"/>
      <stop offset="100%" stop-color="#052a1e"/>
    </radialGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dcefe6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe9a3"/>
      <stop offset="100%" stop-color="#e0a83f"/>
    </linearGradient>
    <linearGradient id="archLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2fd49a"/>
      <stop offset="100%" stop-color="#0e8e63"/>
    </linearGradient>
    <mask id="crescentMask">
      <rect width="1024" height="1024" fill="white"/>
      <circle cx="556" cy="258" r="42" fill="black"/>
    </mask>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- decorative rays -->
  <g opacity="0.3" stroke="#ffe9a3" stroke-width="8" stroke-linecap="round">
    <line x1="512" y1="300" x2="512" y2="196"/>
    <line x1="662" y1="330" x2="738" y2="256"/>
    <line x1="362" y1="330" x2="286" y2="256"/>
    <line x1="696" y1="436" x2="786" y2="404"/>
    <line x1="328" y1="436" x2="238" y2="404"/>
  </g>

  <!-- mihrab arch -->
  <path d="M336 768 V548 C336 408 420 336 512 336 C604 336 688 408 688 548 V768 Z"
        fill="none" stroke="url(#archLine)" stroke-width="26" stroke-linecap="round" opacity="0.9"/>
  <path d="M368 768 V552 C368 428 438 360 512 360 C586 360 656 428 656 552 V768 Z"
        fill="rgba(5,42,30,0.55)" stroke="none"/>

  <!-- open book -->
  <g>
    <!-- left page -->
    <path d="M512 612 C462 600 408 600 360 618 L384 716 C424 706 472 706 512 716 Z" fill="url(#ice)"/>
    <!-- right page -->
    <path d="M512 612 C562 600 616 600 664 618 L640 716 C600 706 552 706 512 716 Z" fill="url(#ice)"/>
    <!-- spine highlight -->
    <line x1="512" y1="614" x2="512" y2="714" stroke="#b6cdc1" stroke-width="10" stroke-linecap="round"/>
    <!-- bookmark -->
    <rect x="500" y="620" width="24" height="78" rx="7" fill="url(#gold)"/>
  </g>

  <!-- pulpit steps -->
  <g>
    <rect x="380" y="794" width="264" height="42" rx="12" fill="url(#gold)"/>
    <rect x="402" y="752" width="220" height="42" rx="12" fill="url(#gold)"/>
    <rect x="424" y="710" width="176" height="42" rx="12" fill="url(#gold)"/>
  </g>

  <!-- crescent -->
  <circle cx="512" cy="278" r="58" fill="#ffe9a3" mask="url(#crescentMask)"/>
  <!-- star -->
  <path d="M596 232 C600 252 604 256 624 260 C604 264 600 268 596 288 C592 268 588 264 568 260 C588 256 592 252 596 232 Z" fill="#ffe9a3"/>
</svg>